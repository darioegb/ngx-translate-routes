name: CI
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Run linting
        run: pnpm lint

  test_unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Run unit tests
        run: pnpm test:prod
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: '${{ github.job }}'
          path: coverage/

  sonarcloud_check:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [test_lint, test_unit]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - uses: actions/cache@v3
        with:
          path: |-
            node_modules/
            .sonar/cache
          key: '${{ github.job }}'
      - uses: actions/download-artifact@v4
        with:
          name: test_unit
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: [test_lint, test_unit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # semantic-release pushes the release commit/tag straight to main - PAT_TOKEN
          # bypasses branch protection if needed. secrets.GITHUB_TOKEN works too if main
          # has no protection rule blocking the default token.
          token: ${{ secrets.PAT_TOKEN }}
      - uses: ./.github/actions/setup
        with:
          registry-url: 'https://registry.npmjs.org'
      - name: Build package for semantic-release
        run: pnpm ng build ngx-translate-routes
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          # Publishing authenticates via npm trusted publishing (OIDC, id-token: write) - no npm token.
          NPM_CONFIG_PROVENANCE: 'true'
          # @semantic-release/git's release commit body embeds the full changelog notes
          # (long markdown links), which fails commitlint's line-length rules via the
          # local commit-msg husky hook meant to police human-authored commits, not this
          # generated one - skip it here rather than relaxing commitlint for real commits.
          HUSKY: 0
