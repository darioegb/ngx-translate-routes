name: Bug Report
description: Report a problem with ngx-translate-routes
labels: ['bug']
body:
  - type: input
    id: lib-version
    attributes:
      label: ngx-translate-routes version
      placeholder: e.g. 3.0.0
    validations:
      required: true
  - type: input
    id: angular-version
    attributes:
      label: Angular version
      placeholder: e.g. 22.1.2
    validations:
      required: true
  - type: dropdown
    id: usage-mode
    attributes:
      label: How is the library configured?
      options:
        - 'provideNgxTranslateRoutes() (client-side only)'
        - 'provideNgxTranslateRoutes() + provideNgxTranslateRoutesSsr() (SSR)'
        - 'NgxTranslateRoutesModule.forRoot() (deprecated)'
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps to reproduce, ideally a Stackblitz link or minimal repo.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
