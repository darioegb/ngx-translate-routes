<ng-template #langSelect>
  <select
    class="form-select form-select-sm w-auto"
    id="changeLanguage"
    aria-label="Select a language"
    [(ngModel)]="language"
    (change)="changeLanguage()"
  >
    @for (item of languages; track item.key) {
      <option [value]="item.value">
        {{ item.key }}
      </option>
    }
  </select>
</ng-template>

@if (!embedded) {
  <nav class="navbar app-navbar">
    <div class="container-fluid gap-3">
      <a
        class="navbar-brand d-flex align-items-center gap-2 fw-bold mb-0"
        [href]="links.docs"
      >
        <img src="assets/logo.svg" alt="" width="32" height="32" />
        ngx-translate-routes
      </a>
      <div class="navbar-nav ms-auto flex-row align-items-center gap-3">
        <a class="nav-link" [href]="links.docs" target="_blank" rel="noreferrer"
          >Docs</a
        >
        <a
          class="nav-link"
          [href]="links.github"
          target="_blank"
          rel="noreferrer"
          >GitHub</a
        >
        <a class="nav-link" [href]="links.npm" target="_blank" rel="noreferrer"
          >npm</a
        >
        <ng-container [ngTemplateOutlet]="langSelect"></ng-container>
        <button
          type="button"
          class="btn btn-link nav-link p-1 theme-toggle"
          [attr.aria-label]="
            theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'
          "
          (click)="toggleTheme()"
        >
          @if (theme() === 'light') {
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 9c1.65 0 3 1.35 3 3s-1.35 3-3 3-3-1.35-3-3 1.35-3 3-3m0-2c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"
              />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M9.37 5.51c-.18.64-.27 1.31-.27 1.99 0 4.08 3.32 7.4 7.4 7.4.68 0 1.35-.09 1.99-.27a7.014 7.014 0 0 1-6.06 3.5c-3.86 0-7-3.14-7-7 0-2.5 1.34-4.82 3.5-6.06M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"
              />
            </svg>
          }
        </button>
      </div>
    </div>
  </nav>
}

<main class="container py-3">
  @if (embedded) {
    <div
      class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4"
    >
      <div
        class="alert alert-secondary d-flex flex-wrap gap-3 small mb-0"
        role="status"
      >
        <span
          ><strong>URL:</strong> <code>{{ currentPath() }}</code></span
        >
        <span><strong>Title:</strong> {{ currentTitle() }}</span>
      </div>
      <ng-container [ngTemplateOutlet]="langSelect"></ng-container>
    </div>
  }

  <div class="row g-4">
    <section class="col-lg-6">
      <div class="card shadow-sm h-100">
        <div class="card-header fw-semibold">Navigate</div>
        <div class="card-body">
          <p class="text-body-secondary small">
            Pick a language, then follow a link: ngx-translate-routes translates
            the URL segment and the page title.
          </p>
          <div class="list-group">
            <a
              class="list-group-item list-group-item-action"
              [routerLink]="['/aboutAs']"
              [queryParams]="{ name: 'Test', email: 'test@test.com' }"
            >
              About
            </a>
            <a
              class="list-group-item list-group-item-action"
              [routerLink]="['/dashboard']"
              >Dashboard</a
            >
            <a
              class="list-group-item list-group-item-action"
              [routerLink]="['/profile']"
              >Profile</a
            >
            <a
              class="list-group-item list-group-item-action"
              [routerLink]="['/myAccount']"
              >My Account</a
            >
            <a
              class="list-group-item list-group-item-action"
              [routerLink]="['/users/profile', idUser]"
              >Users</a
            >
          </div>
          <div class="mt-3">
            <router-outlet />
          </div>
        </div>
      </div>
    </section>
    <section class="col-lg-6">
      <app-code-snippet />
    </section>
  </div>
</main>
